<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-label="Craft — motion, polish, taste">
  <title>Craft</title>
  <defs>
    <linearGradient id="word" gradientUnits="userSpaceOnUse" x1="204" y1="0" x2="500" y2="0">
      <stop offset="0" stop-color="#E0A106"/>
      <stop offset="0.5" stop-color="#1FA39A"/>
      <stop offset="1" stop-color="#E5604D"/>
    </linearGradient>
    <style>
      .arc { fill: none; stroke-linecap: round; stroke-width: 16;
             stroke-dasharray: 80.5; stroke-dashoffset: 80.5;
             animation: draw 1.1s cubic-bezier(.2,.85,.25,1) forwards; }
      .a1 { stroke: #E0A106; animation-delay: .15s; }
      .a2 { stroke: #1FA39A; animation-delay: .32s; }
      .a3 { stroke: #E5604D; animation-delay: .49s; }
      .spin { transform-box: view-box; transform-origin: 110px 110px;
              animation: spin 26s linear infinite; }
      .dot { transform-box: view-box; transform-origin: 110px 110px; opacity: 0;
             animation: pop .55s .72s cubic-bezier(.2,.85,.25,1) forwards,
                        breathe 4.2s 1.3s ease-in-out infinite; }
      .word { opacity: 0; transform-box: view-box;
              animation: rise .8s .55s cubic-bezier(.2,.85,.25,1) forwards; }
      .rule { transform-box: view-box; transform-origin: 204px 150px;
              transform: scaleX(0);
              animation: wipe .9s 1s cubic-bezier(.2,.85,.25,1) forwards; }
      .tag  { opacity: 0; animation: fade 1.1s 1.25s ease forwards; }
      @keyframes draw    { to { stroke-dashoffset: 0; } }
      @keyframes spin    { to { transform: rotate(360deg); } }
      @keyframes pop     { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.22); } }
      @keyframes rise    { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes wipe    { to { transform: scaleX(1); } }
      @keyframes fade    { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .arc { stroke-dashoffset: 0; animation: none; }
        .spin, .dot, .word, .tag, .rule { animation: none; opacity: 1; transform: none; }
        .rule { transform: scaleX(1); }
      }
    </style>
  </defs>

  <!-- aperture mark: three lens blades -->
  <g class="spin">
    <path class="arc a1" d="M139.6,74.8 A46,46 0 0 1 139.6,145.2"/>
    <path class="arc a2" d="M125.7,153.2 A46,46 0 0 1 64.7,118.0"/>
    <path class="arc a3" d="M64.7,102.0 A46,46 0 0 1 125.7,66.8"/>
  </g>
  <circle class="dot" cx="110" cy="110" r="7" fill="url(#word)"/>

  <!-- wordmark -->
  <g class="word">
    <text x="204" y="134" font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace"
          font-size="96" font-weight="700" letter-spacing="2" fill="url(#word)">craft</text>
  </g>
  <rect class="rule" x="204" y="150" width="292" height="5" rx="2.5" fill="url(#word)"/>
  <text class="tag" x="206" y="184"
        font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace"
        font-size="18" font-weight="500" letter-spacing="5" fill="#8b9099">MOTION · POLISH · TASTE</text>
</svg>
