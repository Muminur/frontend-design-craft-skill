<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Craft mark">
  <title>Craft mark</title>
  <defs>
    <linearGradient id="m" gradientUnits="userSpaceOnUse" x1="18" y1="20" x2="102" y2="100">
      <stop offset="0" stop-color="#E0A106"/>
      <stop offset="0.5" stop-color="#1FA39A"/>
      <stop offset="1" stop-color="#E5604D"/>
    </linearGradient>
    <style>
      .arc { fill: none; stroke-linecap: round; stroke-width: 14;
             stroke-dasharray: 73.3; stroke-dashoffset: 73.3;
             animation: draw 1.1s cubic-bezier(.2,.85,.25,1) forwards; }
      .a1 { stroke: #E0A106; animation-delay: .12s; }
      .a2 { stroke: #1FA39A; animation-delay: .28s; }
      .a3 { stroke: #E5604D; animation-delay: .44s; }
      .spin { transform-box: view-box; transform-origin: 60px 60px;
              animation: spin 24s linear infinite; }
      .dot { transform-box: view-box; transform-origin: 60px 60px; opacity: 0;
             animation: pop .5s .65s cubic-bezier(.2,.85,.25,1) forwards,
                        breathe 4.2s 1.2s ease-in-out infinite; }
      @keyframes draw    { to { stroke-dashoffset: 0; } }
      @keyframes spin    { to { transform: rotate(360deg); } }
      @keyframes pop     { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.22); } }
      @media (prefers-reduced-motion: reduce) {
        .arc { stroke-dashoffset: 0; animation: none; }
        .spin, .dot { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </defs>
  <g class="spin">
    <path class="arc a1" d="M87.0,27.8 A42,42 0 0 1 87.0,92.2"/>
    <path class="arc a2" d="M74.4,99.5 A42,42 0 0 1 18.6,67.3"/>
    <path class="arc a3" d="M18.6,52.7 A42,42 0 0 1 74.4,20.5"/>
  </g>
  <circle class="dot" cx="60" cy="60" r="6.5" fill="url(#m)"/>
</svg>
